{% extends "base.html" %}

{% block title %}新建订单 - 氧化加工厂财务系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>➕ 新建订单</h2>
    <p>创建新的加工订单</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="customer_name">客户名称 *</label>
                    <input type="text" id="customer_name" name="customer_name" 
                           list="customers" placeholder="输入或选择客户" required>
                    <datalist id="customers">
                        {% for customer in customers %}
                        <option value="{{ customer.name }}">
                        {% endfor %}
                    </datalist>
                </div>
                
                <div class="form-group">
                    <label for="item_description">物品描述</label>
                    <input type="text" id="item_description" name="item_description" 
                           placeholder="如：铝型材6063氧化">
                </div>
                
                <div class="form-group">
                    <label for="pricing_unit">计价方式 *</label>
                    <select id="pricing_unit" name="pricing_unit" required>
                        <option value="件">件</option>
                        <option value="条">条</option>
                        <option value="只">只</option>
                        <option value="个">个</option>
                        <option value="米" selected>米</option>
                        <option value="公斤">公斤</option>
                        <option value="平方米">平方米</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="quantity">数量 *</label>
                    <input type="number" id="quantity" name="quantity" 
                           step="0.01" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="unit_price">单价 *</label>
                    <input type="number" id="unit_price" name="unit_price" 
                           step="0.01" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="order_date">日期</label>
                    <input type="date" id="order_date" name="order_date" 
                           value="{{ today }}">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    💾 保存订单
                </button>
                <a href="{{ url_for('orders') }}" class="btn btn-outline">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
