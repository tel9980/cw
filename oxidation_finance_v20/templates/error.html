{% extends "base.html" %}

{% block title %}错误 - 氧化加工厂财务系统{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1>出错了</h1>
    <p class="error-message">{{ error }}</p>
    <div class="error-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            🏠 返回首页</a>
        <button onclick="history.back()" class="btn btn-outline">
            ↩️ 返回上一页</button>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
.error-container {
    text-align: center;
    padding: 60px 20px;
    max-width: 500px;
    margin: 0 auto;
}

.error-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.error-container h1 {
    color: #e74c3c;
    margin-bottom: 20px;
}

.error-message {
    font-size: 18px;
    color: #666;
    margin-bottom: 30px;
}

.error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
}
</style>
{% endblock %}
