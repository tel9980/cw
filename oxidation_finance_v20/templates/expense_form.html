{% extends "base.html" %}

{% block title %}录入支出 - 氧化加工厂财务系统{% endblock %}

{% block content %}
<div class="page-header">
    <h2>💸 录入支出</h2>
    <p>记录各项支出信息</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="expense_type">支出类型 *</label>
                    <select id="expense_type" name="expense_type" required>
                        {% for type in expense_types %}
                        <option value="{{ type }}">{{ type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="supplier_name">供应商/说明</label>
                    <input type="text" id="supplier_name" name="supplier_name" 
                           placeholder="如：化工原料公司">
                </div>
                
                <div class="form-group">
                    <label for="amount">金额 *</label>
                    <input type="number" id="amount" name="amount" 
                           step="0.01" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="bank_type">银行账户 *</label>
                    <select id="bank_type" name="bank_type" required>
                        <option value="G银行">G银行（有发票）</option>
                        <option value="N银行">N银行（现金/微信）</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="expense_date">日期</label>
                    <input type="date" id="expense_date" name="expense_date" 
                           value="{{ today }}">
                </div>
                
                <div class="form-group form-group-full">
                    <label for="description">备注</label>
                    <input type="text" id="description" name="description" 
                           placeholder="如：三酸采购">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-warning">
                    💾 保存支出
                </button>
                <a href="{{ url_for('index') }}" class="btn btn-outline">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
