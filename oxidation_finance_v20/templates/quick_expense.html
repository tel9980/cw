{% extends "base.html" %}

{% block title %}快速记录支出 - 氧化加工厂财务系统{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>💸 快速记录支出</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>支出类型 *</label>
                <select name="expense_type" class="form-control" required>
                    <option value="房租">房租</option>
                    <option value="水电费">水电费</option>
                    <option value="三酸">三酸</option>
                    <option value="片碱">片碱</option>
                    <option value="亚钠">亚钠</option>
                    <option value="色粉">色粉</option>
                    <option value="除油剂">除油剂</option>
                    <option value="挂具">挂具</option>
                    <option value="外发加工费">外发加工费</option>
                    <option value="日常费用">日常费用</option>
                    <option value="工资">工资</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>供应商/说明</label>
                <input type="text" name="supplier_name" class="form-control" placeholder="如：化工原料公司">
            </div>
            <div class="form-group">
                <label>金额 *</label>
                <input type="number" name="amount" class="form-control" step="0.01" placeholder="输入金额" required>
            </div>
            <div class="form-group">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="has_invoice">
                        <span>有发票</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_n_bank">
                        <span>N银行/微信（现金）</span>
                    </label>
                </div>
                <small class="form-text text-muted">
                    不勾选默认为 G银行（有票账户）
                </small>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" name="description" class="form-control" placeholder="如：三酸采购">
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-warning btn-lg">保存支出</button>
                <a href="{{ url_for('assistant') }}" class="btn btn-lg" style="background: #999;">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
