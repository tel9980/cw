{% extends "base.html" %}

{% block title %}快速记录收入 - 氧化加工厂财务系统{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3>💰 快速记录收入</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>客户名称 *</label>
                <input type="text" name="customer_name" class="form-control" placeholder="输入客户名称" required>
            </div>
            <div class="form-group">
                <label>金额 *</label>
                <input type="number" name="amount" class="form-control" step="0.01" placeholder="输入金额" required>
            </div>
            <div class="form-group">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="has_invoice">
                        <span>有发票</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_n_bank">
                        <span>N银行/微信（现金）</span>
                    </label>
                </div>
                <small class="form-text text-muted">
                    不勾选默认为 G银行（有票账户）
                </small>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" name="notes" class="form-control" placeholder="如：订单OX202401001收款">
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-success btn-lg">保存收入</button>
                <a href="/assistant" class="btn btn-lg" style="background: #999;">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
